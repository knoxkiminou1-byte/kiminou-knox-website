<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Kiminou Knox</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root { --kk-paper: #f6f1e7; --kk-ink: #141a10; --kk-brass: #8a6d2f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--kk-paper); color: var(--kk-ink);
        font-family: Georgia, "Times New Roman", serif;
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 2rem;
      }
      .eyebrow {
        font-family: -apple-system, "Segoe UI", sans-serif;
        font-size: 11px; font-weight: 700; letter-spacing: 0.32em;
        text-transform: uppercase; color: var(--kk-brass);
      }
      h1 { font-size: clamp(2.25rem, 6vw, 3.5rem); font-weight: 400; margin-top: 1.25rem; }
      p { font-size: 1.125rem; opacity: 0.65; margin-top: 1rem; max-width: 32rem; }
      a {
        display: inline-block; margin-top: 2rem; padding: 0.9rem 1.75rem;
        background: var(--kk-ink); color: var(--kk-paper); border-radius: 999px;
        font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px;
        font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div>
      <p class="eyebrow">404</p>
      <h1>Off the map.</h1>
      <p>That page isn't part of the story. Start back at the beginning.</p>
      <a href="/">Back home</a>
    </div>
  </body>
</html>
